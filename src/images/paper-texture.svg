<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <filter id="paper-grain">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.32"
      numOctaves="2"
      seed="12"
      result="fiber-noise"
    />
    <feColorMatrix
      in="fiber-noise"
      type="saturate"
      values="0"
      result="paper-noise"
    />
    <feComponentTransfer in="paper-noise">
      <feFuncR type="linear" slope="1.25" intercept="-0.125" />
      <feFuncG type="linear" slope="1.25" intercept="-0.125" />
      <feFuncB type="linear" slope="1.25" intercept="-0.125" />
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#paper-grain)" />
</svg>
